<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="900" height="90"
     font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" role="img"
     aria-label="Footer">
  <defs>
    <linearGradient id="lineGrad" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="840" y2="0">
      <stop offset="0" stop-color="#00D26A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00D26A"/>
      <stop offset="1" stop-color="#6EE7B7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D26A"/>
      <stop offset="1" stop-color="#6EE7B7"/>
    </linearGradient>
    <symbol id="core" viewBox="-60 -60 120 120">
      <polygon points="0,-54 46.8,-27 46.8,27 0,54 -46.8,27 -46.8,-27" fill="none" stroke="url(#coreGrad)" stroke-width="6"/>
      <circle cx="0" cy="0" r="16" fill="#00D26A"/>
    </symbol>
  </defs>
  <style>
    text { font-size: 12.5px; fill: #9CA3AF; }
    .cur { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cur { animation: none !important; } }
  </style>
  <rect x="60" y="20" width="780" height="1.5" fill="url(#lineGrad)"/>
  <use href="#core" x="426" y="30" width="14" height="14"/>
  <text x="450" y="64" text-anchor="middle">$ exit — thanks for reading the source<tspan class="cur" fill="#00D26A">_</tspan></text>
</svg>
