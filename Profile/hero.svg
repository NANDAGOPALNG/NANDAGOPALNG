  <g class="fade" style="animation: fadeIn .25s ease .95s forwards">
    <text x="220" y="204" font-size="25"><tspan class="bright">nanda</tspan><tspan class="dim">@</tspan><tspan fill="url(#flow)">agentic-systems</tspan></text>
  </g>
  <line x1="220" y1="216" x2="470" y2="216" stroke="#233046"/>
  <g class="fade" style="animation: fadeIn .2s ease 1.08s forwards">
    <text x="220" y="240"><tspan class="lbl">ROLE</tspan><tspan x="316" class="txt" font-size="13">AI Engineer</tspan></text>
  </g>
  <g class="fade" style="animation: fadeIn .2s ease 1.16s forwards">
    <text x="220" y="266"><tspan class="lbl">FOCUS</tspan><tspan x="316" class="txt" font-size="13">Agentic systems · LLM infra</tspan></text>
  </g>
  <g class="fade" style="animation: fadeIn .2s ease 1.24s forwards">
    <text x="220" y="292"><tspan class="lbl">BUILDING</tspan><tspan x="316" class="txt" font-size="13">Lumora · Orchestrix · Sentinel-SRE</tspan></text>
  </g>

  <line x1="52" y1="344" x2="848" y2="344" stroke="#182233"/>

  <!-- status query -->
  <g class="type" style="animation: typeIn .35s steps(28,start) 1.38s forwards">
    <text x="52" y="372" font-size="15"><tspan class="cy">nanda</tspan><tspan class="dim">:~ (main) $</tspan><tspan class="txt"> orchestrix status --agents</tspan></text>
  </g>

  <g class="fade" style="animation: fadeIn .2s ease 1.8s forwards">
    <text x="52" y="400" font-size="12.5"><tspan class="dim">  NAME</tspan><tspan class="dim" x="250">STACK</tspan><tspan class="dim" x="560">STATE</tspan></text>
  </g>
  <line x1="52" y1="410" x2="848" y2="410" stroke="#131b28"/>

  <g class="fade" style="animation: fadeIn .2s ease 1.92s forwards">
    <circle cx="58" cy="433" r="3.5" class="ok node-pulse"/>
    <text x="70" y="437"><tspan class="txt">lumora</tspan></text>
    <text x="250" y="437" class="mut" font-size="13">rag · fastapi · qdrant · postgres</text>
    <text x="560" y="437" class="cy" font-size="13">building — daily commits</text>
  </g>
  <g class="fade" style="animation: fadeIn .2s ease 2.02s forwards">
    <circle cx="58" cy="463" r="3.5" class="ok node-pulse"/>
    <text x="70" y="467"><tspan class="txt">orchestrix</tspan></text>
    <text x="250" y="467" class="mut" font-size="13">multi-agent · shared context · eval loop</text>
    <text x="560" y="467" class="cy" font-size="13">shipped — flagship</text>
  </g>
  <g class="fade" style="animation: fadeIn .2s ease 2.12s forwards">
    <circle cx="58" cy="493" r="3.5" class="ok node-pulse"/>
    <text x="70" y="497"><tspan class="txt">sentinel-sre</tspan></text>
    <text x="250" y="497" class="mut" font-size="13">langgraph · fastmcp · self-correction loop</text>
    <text x="560" y="497" class="cy" font-size="13">shipped — 9.3x efficiency</text>
  </g>

  <line x1="52" y1="524" x2="848" y2="524" stroke="#182233"/>

  <!-- cycle query -->
  <g class="type" style="animation: typeIn .35s steps(22,start) 2.28s forwards">
    <text x="52" y="552" font-size="15"><tspan class="cy">nanda</tspan><tspan class="dim">:~ (main) $</tspan><tspan class="txt"> orchestrix trace --cycle</tspan></text>
  </g>

  <!-- agentic loop diagram (signature element) -->
  <g class="fade" style="animation: fadeIn .4s ease 2.65s forwards">
    <g transform="translate(450,750)">
      <!-- connecting loop -->
      <path d="M -150 0 A 150 150 0 0 1 0 -150" fill="none" stroke="url(#flow)" stroke-width="2" class="flowline" opacity="0.85"/>
      <path d="M 0 -150 A 150 150 0 0 1 150 0" fill="none" stroke="url(#flow)" stroke-width="2" class="flowline" opacity="0.85"/>
      <path d="M 150 0 A 150 150 0 0 1 0 150" fill="none" stroke="url(#flow)" stroke-width="2" class="flowline" opacity="0.85"/>
      <path d="M 0 150 A 150 150 0 0 1 -150 0" fill="none" stroke="url(#flow)" stroke-width="2" class="flowline" opacity="0.85"/>

      <!-- nodes -->
      <g>
        <circle cx="0" cy="-150" r="34" fill="#0a0f1a" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="0" y="-146" text-anchor="middle" class="txt" font-size="12.5">PLAN</text>
      </g>
      <g>
        <circle cx="150" cy="0" r="34" fill="#0a0f1a" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="150" y="4" text-anchor="middle" class="txt" font-size="12.5">ACT</text>
      </g>
      <g>
        <circle cx="0" cy="150" r="34" fill="#0a0f1a" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="0" y="154" text-anchor="middle" class="txt" font-size="11.5">OBSERVE</text>
      </g>
      <g>
        <circle cx="-150" cy="0" r="34" fill="#0a0f1a" stroke="#60a5fa" stroke-width="1.5"/>
        <text x="-150" y="4" text-anchor="middle" class="txt" font-size="11.5">CRITIQUE</text>
      </g>

      <text x="0" y="6" text-anchor="middle" class="dim" font-size="11">agentic</text>
      <text x="0" y="20" text-anchor="middle" class="dim" font-size="11">loop</text>
    </g>
  </g>

  <g class="fade" style="animation: fadeIn .3s ease 3s forwards">
    <text x="450" y="926" text-anchor="middle" class="dim" font-size="12.5">CSE (AI &amp; ML) · Maharaja Institute of Technology, Mysore · 2023–2027</text>
  </g>
</svg>
