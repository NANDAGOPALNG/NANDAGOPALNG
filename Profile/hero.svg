      <rect x="96" y="48" width="7" height="7" fill="#2db0f1"/>
      <rect x="0" y="56" width="7" height="7" fill="#2eaaf2"/>
      <rect x="8" y="56" width="7" height="7" fill="#2eaaf2"/>
      <rect x="48" y="56" width="7" height="7" fill="#2eaaf2"/>
      <rect x="56" y="56" width="7" height="7" fill="#2eaaf2"/>
      <rect x="88" y="56" width="7" height="7" fill="#2eaaf2"/>
      <rect x="96" y="56" width="7" height="7" fill="#2eaaf2"/>
