<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 960" width="900" height="960"
     font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" role="img"
     aria-label="Nanda Gopal D. — agent orchestration console">
  <defs>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="840" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="flowV" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    text { font-size: 14px; }
    .dim   { fill: #56637a; }
    .mut   { fill: #8592ab; }
    .txt   { fill: #cbd5e1; }
    .bright{ fill: #e7edf6; }
    .cy    { fill: #22d3ee; }
    .bl    { fill: #60a5fa; }
    .ok    { fill: #22d3ee; }
    .amber { fill: #7dd3fc; }
    .lbl   { fill: #22d3ee; font-size: 11.5px; letter-spacing: 1.5px; }

    .fade { opacity: 0; }
    .type { clip-path: inset(0 100% 0 0); }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes typeIn { to { clip-path: inset(0 0 0 0); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes dashFlow { to { stroke-dashoffset: -40; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes popIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }

    @media (prefers-reduced-motion: reduce) {
      .fade, .type, .cur, .flowline, .node-pulse, .logo-cell { animation: none !important; opacity: 1 !important; clip-path: inset(0 0 0 0) !important; transform: none !important; }
    }

    .flowline { stroke-dasharray: 6 6; animation: dashFlow 1.4s linear infinite; }
    .node-pulse { animation: pulse 2.4s ease-in-out infinite; }
    .cur { animation: blink 1s step-end infinite; }
    .logo-cell { animation: popIn .3s ease both; transform-origin: center; transform-box: fill-box; }
  </style>

  <!-- window -->
  <rect x="20" y="16" width="860" height="914" rx="14" fill="#05070a" stroke="#182233"/>
  <path d="M20 30 A14 14 0 0 1 34 16 H846 A14 14 0 0 1 860 30 V58 H20 Z" fill="#0a0f1a"/>
  <line x1="20" y1="58" x2="860" y2="58" stroke="#182233"/>
  <circle cx="46" cy="37" r="6" fill="#3a4557"/>
  <circle cx="66" cy="37" r="6" fill="#3a4557"/>
  <circle cx="86" cy="37" r="6" fill="#3a4557"/>
  <text x="450" y="42" text-anchor="middle" class="dim" font-size="12.5">orchestrix://runtime — nanda@agentic-systems</text>

  <rect x="34" y="72" width="832" height="840" fill="url(#glow)" opacity="0.4"/>

  <!-- boot log -->
  <g class="fade" style="animation: fadeIn .2s ease .05s forwards">
    <text x="52" y="98"><tspan class="dim">[ </tspan><tspan class="ok">OK</tspan><tspan class="dim"> ] </tspan><tspan class="mut">runtime.init() — loading agent registry</tspan></text>
  </g>
  <g class="fade" style="animation: fadeIn .2s ease .18s forwards">
    <text x="52" y="120"><tspan class="dim">[ </tspan><tspan class="ok">OK</tspan><tspan class="dim"> ] </tspan><tspan class="mut">context.mount() — shared memory attached</tspan></text>
  </g>
  <g class="fade" style="animation: fadeIn .2s ease .31s forwards">
    <text x="52" y="142"><tspan class="dim">[ </tspan><tspan class="ok">OK</tspan><tspan class="dim"> ] </tspan><tspan class="mut">tools.register() — 4 tools bound to graph</tspan></text>
  </g>
  <g class="fade" style="animation: fadeIn .2s ease .44s forwards">
    <text x="52" y="164"><tspan class="dim">[ </tspan><tspan class="ok">OK</tspan><tspan class="dim"> ] </tspan><tspan class="mut">safety.gate() — human-in-the-loop checkpoint armed</tspan></text>
  </g>

  <!-- identity block: pixel monogram + neofetch-style info -->
  <g class="fade" style="animation: fadeIn .2s ease .55s forwards">
    <g transform="translate(90,182)">
      <rect x="0" y="0" width="7" height="7" fill="#22d3ee"/>
      <rect x="8" y="0" width="7" height="7" fill="#22d3ee"/>
      <rect x="16" y="0" width="7" height="7" fill="#22d3ee"/>
