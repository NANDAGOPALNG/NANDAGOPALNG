      <rect x="88" y="104" width="7" height="7" fill="#3988f5"/>
      <rect x="96" y="104" width="7" height="7" fill="#3988f5"/>
      <rect x="0" y="112" width="7" height="7" fill="#3b82f6"/>
      <rect x="8" y="112" width="7" height="7" fill="#3b82f6"/>
      <rect x="88" y="112" width="7" height="7" fill="#3b82f6"/>
      <rect x="96" y="112" width="7" height="7" fill="#3b82f6"/>
