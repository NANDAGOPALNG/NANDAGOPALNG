      <rect x="88" y="16" width="7" height="7" fill="#26c7ef"/>
      <rect x="96" y="16" width="7" height="7" fill="#26c7ef"/>
      <rect x="0" y="24" width="7" height="7" fill="#27c2f0"/>
      <rect x="8" y="24" width="7" height="7" fill="#27c2f0"/>
      <rect x="24" y="24" width="7" height="7" fill="#27c2f0"/>
      <rect x="32" y="24" width="7" height="7" fill="#27c2f0"/>
      <rect x="88" y="24" width="7" height="7" fill="#27c2f0"/>
      <rect x="96" y="24" width="7" height="7" fill="#27c2f0"/>
      <rect x="0" y="32" width="7" height="7" fill="#29bcf0"/>
      <rect x="8" y="32" width="7" height="7" fill="#29bcf0"/>
      <rect x="32" y="32" width="7" height="7" fill="#29bcf0"/>
      <rect x="40" y="32" width="7" height="7" fill="#29bcf0"/>
      <rect x="88" y="32" width="7" height="7" fill="#29bcf0"/>
      <rect x="96" y="32" width="7" height="7" fill="#29bcf0"/>
      <rect x="0" y="40" width="7" height="7" fill="#2bb6f1"/>
      <rect x="8" y="40" width="7" height="7" fill="#2bb6f1"/>
