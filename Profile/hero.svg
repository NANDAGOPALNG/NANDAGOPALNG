<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 980" width="900" height="980"
     font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" role="img"
     aria-label="nandaOS kernel — AI infrastructure runtime">
  <defs>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D26A"/>
      <stop offset="1" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="lineGrad" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="840" y2="0">
      <stop offset="0" stop-color="#00D26A"/>
      <stop offset="1" stop-color="#6EE7B7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00D26A" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#00D26A" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00D26A"/>
    </marker>

    <symbol id="core" viewBox="-60 -60 120 120">
      <polygon points="0,-54 46.8,-27 46.8,27 0,54 -46.8,27 -46.8,-27" fill="none" stroke="url(#coreGrad)" stroke-width="3"/>
      <polygon points="0,-54 46.8,-27 46.8,27 0,54 -46.8,27 -46.8,-27" fill="#00D26A" opacity="0.05"/>
      <line x1="0" y1="0" x2="0" y2="28" stroke="#00D26A" stroke-width="1.6" opacity="0.85"/>
      <line x1="0" y1="0" x2="-24.2" y2="-14" stroke="#00D26A" stroke-width="1.6" opacity="0.85"/>
      <line x1="0" y1="0" x2="24.2" y2="-14" stroke="#00D26A" stroke-width="1.6" opacity="0.85"/>
      <line x1="0" y1="28" x2="-24.2" y2="-14" stroke="#2a2a2a" stroke-width="1.2"/>
      <line x1="-24.2" y1="-14" x2="24.2" y2="-14" stroke="#2a2a2a" stroke-width="1.2"/>
      <line x1="24.2" y1="-14" x2="0" y2="28" stroke="#2a2a2a" stroke-width="1.2"/>
      <circle cx="0" cy="28" r="5" fill="#6EE7B7"/>
      <circle cx="-24.2" cy="-14" r="5" fill="#6EE7B7"/>
      <circle cx="24.2" cy="-14" r="5" fill="#6EE7B7"/>
      <circle cx="0" cy="0" r="8" fill="#00D26A" class="core-pulse"/>
      <circle cx="0" cy="0" r="13" fill="none" stroke="#00D26A" stroke-width="1" opacity="0.4"/>
    </symbol>
  </defs>

  <style>
    text { font-size: 14px; }
    .dim    { fill: #9CA3AF; opacity: 0.75; }
    .mut    { fill: #9CA3AF; }
    .txt    { fill: #F5F5F5; }
    .bright { fill: #F5F5F5; }
    .accent { fill: #00D26A; }
    .accent2{ fill: #6EE7B7; }
    .lbl    { fill: #00D26A; font-size: 11.5px; letter-spacing: 1.6px; }

    .fade { opacity: 0; }
    .type { clip-path: inset(0 100% 0 0); }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes typeIn { to { clip-path: inset(0 0 0 0); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes dashFlow { to { stroke-dashoffset: -32; } }
    @keyframes pulse { 0%, 100% { opacity: .4; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.05); } }
    @keyframes corePulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .fade, .type, .cur, .edge-flow, .node-pulse, .core-pulse { animation: none !important; opacity: 1 !important; clip-path: inset(0 0 0 0) !important; }
    }

    .edge-flow { stroke-dasharray: 5 5; animation: dashFlow 1.1s linear infinite; }
    .node-pulse { animation: pulse 2.3s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .core-pulse { animation: corePulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .cur { animation: blink 1s step-end infinite; }

    .node-box { fill: #111111; stroke: #222222; stroke-width: 1.4; }
    .node-box-active { fill: #111111; stroke: #00D26A; stroke-width: 1.6; }
  </style>

  <!-- window -->
  <rect x="20" y="16" width="860" height="932" rx="16" fill="#090909" stroke="#222222"/>
  <path d="M20 32 A16 16 0 0 1 36 16 H844 A16 16 0 0 1 860 32 V58 H20 Z" fill="#111111"/>
  <line x1="20" y1="58" x2="860" y2="58" stroke="#222222"/>
  <circle cx="46" cy="37" r="6" fill="#2a2a2a"/>
  <circle cx="66" cy="37" r="6" fill="#2a2a2a"/>
  <circle cx="86" cy="37" r="6" fill="#2a2a2a"/>
  <use href="#core" x="806" y="29" width="16" height="16"/>
  <text x="450" y="42" text-anchor="middle" class="dim" font-size="12.5" letter-spacing="0.5">nandaOS://kernel — runtime session</text>

  <rect x="34" y="72" width="832" height="858" fill="url(#glow)" opacity="0.6"/>

  <!-- boot sequence -->
  <g class="fade" style="animation: fadeIn .18s ease .04s forwards">
    <text x="52" y="98"><tspan class="dim">[ </tspan><tspan class="accent">OK</tspan><tspan class="dim"> ] </tspan><tspan class="mut">loading runtime</tspan></text>
  </g>
  <g class="fade" style="animation: fadeIn .18s ease .14s forwards">
    <text x="52" y="120"><tspan class="dim">[ </tspan><tspan class="accent">OK</tspan><tspan class="dim"> ] </tspan><tspan class="mut">registering tools</tspan></text>
  </g>
  <g class="fade" style="animation: fadeIn .18s ease .24s forwards">
    <text x="52" y="142"><tspan class="dim">[ </tspan><tspan class="accent">OK</tspan><tspan class="dim"> ] </tspan><tspan class="mut">connecting MCP</tspan></text>
  </g>
  <g class="fade" style="animation: fadeIn .18s ease .34s forwards">
    <text x="52" y="164"><tspan class="dim">[ </tspan><tspan class="accent">OK</tspan><tspan class="dim"> ] </tspan><tspan class="mut">initializing vector memory</tspan></text>
  </g>
  <g class="fade" style="animation: fadeIn .18s ease .44s forwards">
    <text x="52" y="186"><tspan class="dim">[ </tspan><tspan class="accent">OK</tspan><tspan class="dim"> ] </tspan><tspan class="mut">loading planner</tspan></text>
  </g>
  <g class="fade" style="animation: fadeIn .18s ease .54s forwards">
    <text x="52" y="208"><tspan class="dim">[ </tspan><tspan class="accent">OK</tspan><tspan class="dim"> ] </tspan><tspan class="mut">loading evaluator</tspan></text>
  </g>
  <g class="fade" style="animation: fadeIn .18s ease .64s forwards">
    <text x="52" y="230"><tspan class="dim">[ </tspan><tspan class="accent">OK</tspan><tspan class="dim"> ] </tspan><tspan class="mut">safety layer enabled</tspan></text>
  </g>
  <g class="fade" style="animation: fadeIn .2s ease .76s forwards">
    <text x="52" y="252"><tspan class="dim">[ </tspan><tspan class="accent" font-weight="600">READY</tspan><tspan class="dim"> ] </tspan><tspan class="txt">system ready</tspan></text>
  </g>

  <!-- identity block: core mark + info -->
  <g class="fade" style="animation: fadeIn .2s ease .9s forwards">
    <use href="#core" x="52" y="278" width="112" height="112"/>
  </g>

  <g class="fade" style="animation: fadeIn .25s ease 1.15s forwards">
    <text x="200" y="308" font-size="25"><tspan class="bright">nanda</tspan><tspan class="dim">@</tspan><tspan fill="url(#coreGrad)">kernel</tspan></text>
  </g>
  <line x1="200" y1="320" x2="450" y2="320" stroke="#222222"/>
  <g class="fade" style="animation: fadeIn .2s ease 1.28s forwards">
    <text x="200" y="344"><tspan class="lbl">ROLE</tspan><tspan x="296" class="txt" font-size="13">AI Engineer</tspan></text>
  </g>
  <g class="fade" style="animation: fadeIn .2s ease 1.36s forwards">
    <text x="200" y="370"><tspan class="lbl">FOCUS</tspan><tspan x="296" class="txt" font-size="13">Agent orchestration · LLM infra</tspan></text>
  </g>
  <g class="fade" style="animation: fadeIn .2s ease 1.44s forwards">
    <text x="200" y="396"><tspan class="lbl">BUILDING</tspan><tspan x="296" class="txt" font-size="13">Lumora · Orchestrix · Sentinel-SRE</tspan></text>
  </g>

  <line x1="52" y1="440" x2="848" y2="440" stroke="#222222"/>

  <!-- status query -->
  <g class="type" style="animation: typeIn .35s steps(26,start) 1.58s forwards">
    <text x="52" y="468" font-size="15"><tspan class="accent">nanda</tspan><tspan class="dim">@kernel:~$</tspan><tspan class="txt"> ps --agents</tspan></text>
  </g>

  <g class="fade" style="animation: fadeIn .2s ease 2s forwards">
    <text x="52" y="496" font-size="12.5"><tspan class="dim">  NAME</tspan><tspan class="dim" x="250">STACK</tspan><tspan class="dim" x="560">STATE</tspan></text>
  </g>
  <line x1="52" y1="506" x2="848" y2="506" stroke="#1a1a1a"/>

  <g class="fade" style="animation: fadeIn .2s ease 2.1s forwards">
    <use href="#core" x="52" y="518" width="16" height="16"/>
    <text x="78" y="530"><tspan class="txt">lumora</tspan></text>
    <text x="250" y="530" class="mut" font-size="13">rag · fastapi · qdrant · postgres</text>
    <text x="560" y="530" class="accent" font-size="13">building — daily commits</text>
  </g>
  <g class="fade" style="animation: fadeIn .2s ease 2.18s forwards">
    <use href="#core" x="52" y="548" width="16" height="16"/>
    <text x="78" y="560"><tspan class="txt">orchestrix</tspan></text>
    <text x="250" y="560" class="mut" font-size="13">multi-agent · shared context · eval loop</text>
    <text x="560" y="560" class="accent" font-size="13">shipped — flagship</text>
  </g>
  <g class="fade" style="animation: fadeIn .2s ease 2.26s forwards">
    <use href="#core" x="52" y="578" width="16" height="16"/>
    <text x="78" y="590"><tspan class="txt">sentinel-sre</tspan></text>
    <text x="250" y="590" class="mut" font-size="13">langgraph · fastmcp · self-correction loop</text>
    <text x="560" y="590" class="accent" font-size="13">shipped — 9.3x efficiency</text>
  </g>

  <line x1="52" y1="616" x2="848" y2="616" stroke="#222222"/>

  <!-- orchestration graph query -->
  <g class="type" style="animation: typeIn .35s steps(24,start) 2.42s forwards">
    <text x="52" y="644" font-size="15"><tspan class="accent">nanda</tspan><tspan class="dim">@kernel:~$</tspan><tspan class="txt"> graph --render</tspan></text>
  </g>

  <!-- orchestration DAG (signature element) -->
  <g class="fade" style="animation: fadeIn .35s ease 2.75s forwards">

    <!-- edges: planner -> router -->
    <line x1="450" y1="698" x2="450" y2="722" stroke="#00D26A" stroke-width="1.6" class="edge-flow" marker-end="url(#arrow)"/>

    <!-- router -> tools/memory/evaluator -->
    <path d="M450,768 L450,786 L180,786 L180,796" fill="none" stroke="#00D26A" stroke-width="1.4" class="edge-flow" marker-end="url(#arrow)"/>
    <path d="M450,768 L450,796" fill="none" stroke="#00D26A" stroke-width="1.4" class="edge-flow" marker-end="url(#arrow)"/>
    <path d="M450,768 L450,786 L720,786 L720,796" fill="none" stroke="#00D26A" stroke-width="1.4" class="edge-flow" marker-end="url(#arrow)"/>

    <!-- tools/memory/evaluator -> output -->
    <path d="M180,842 L180,858 L450,858 L450,868" fill="none" stroke="#6EE7B7" stroke-width="1.4" class="edge-flow" marker-end="url(#arrow)"/>
    <path d="M450,842 L450,868" fill="none" stroke="#6EE7B7" stroke-width="1.4" class="edge-flow" marker-end="url(#arrow)"/>
    <path d="M720,842 L720,858 L450,858 L450,868" fill="none" stroke="#6EE7B7" stroke-width="1.4" class="edge-flow" marker-end="url(#arrow)"/>

    <!-- MCP dashed connector to Tools -->
    <line x1="180" y1="796" x2="180" y2="776" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.7"/>

    <!-- Planner -->
    <rect x="370" y="652" width="160" height="46" rx="8" class="node-box-active" filter="url(#cardShadow)"/>
    <text x="450" y="680" text-anchor="middle" class="txt" font-size="13.5">PLANNER</text>

    <!-- Router -->
    <rect x="370" y="722" width="160" height="46" rx="8" class="node-box-active" filter="url(#cardShadow)"/>
    <text x="450" y="750" text-anchor="middle" class="txt" font-size="13.5">ROUTER</text>

    <!-- MCP (external, dashed) -->
    <rect x="110" y="742" width="140" height="34" rx="8" fill="#111111" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="180" y="764" text-anchor="middle" class="mut" font-size="11.5">MCP SERVER</text>

    <!-- Tools / Memory / Evaluator -->
    <rect x="110" y="796" width="140" height="46" rx="8" class="node-box" filter="url(#cardShadow)"/>
    <text x="180" y="824" text-anchor="middle" class="txt" font-size="13">TOOLS</text>

    <rect x="380" y="796" width="140" height="46" rx="8" class="node-box" filter="url(#cardShadow)"/>
    <text x="450" y="824" text-anchor="middle" class="txt" font-size="13">MEMORY</text>

    <rect x="650" y="796" width="140" height="46" rx="8" class="node-box" filter="url(#cardShadow)"/>
    <text x="720" y="824" text-anchor="middle" class="txt" font-size="13">EVALUATOR</text>

    <!-- Output -->
    <rect x="365" y="868" width="170" height="46" rx="8" class="node-box-active" filter="url(#cardShadow)"/>
    <text x="450" y="896" text-anchor="middle" class="accent2" font-size="13.5">OUTPUT</text>

    <circle cx="450" cy="675" r="2.5" fill="#00D26A" class="node-pulse"/>
    <circle cx="450" cy="745" r="2.5" fill="#00D26A" class="node-pulse"/>
  </g>

  <g class="fade" style="animation: fadeIn .3s ease 3.3s forwards">
    <text x="450" y="944" text-anchor="middle" class="dim" font-size="12.5">CSE (AI &amp; ML) · Maharaja Institute of Technology, Mysore · 2023–2027</text>
  </g>
</svg>
