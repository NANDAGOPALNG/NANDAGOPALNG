<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 860" width="900" height="860"
     font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" role="img"
     aria-label="Nanda Gopal D. — agent orchestration console">
  <defs>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="840" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="flowV" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    text { font-size: 14px; }
    .dim   { fill: #56637a; }
    .mut   { fill: #8592ab; }
    .txt   { fill: #cbd5e1; }
    .bright{ fill: #e7edf6; }
    .cy    { fill: #22d3ee; }
    .bl    { fill: #60a5fa; }
    .ok    { fill: #22d3ee; }
    .amber { fill: #7dd3fc; }

    .fade { opacity: 0; }
    .type { clip-path: inset(0 100% 0 0); }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes typeIn { to { clip-path: inset(0 0 0 0); } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes dashFlow { to { stroke-dashoffset: -40; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .fade, .type, .cur, .flowline, .node-pulse { animation: none !important; opacity: 1 !important; clip-path: inset(0 0 0 0) !important; }
    }

    .flowline { stroke-dasharray: 6 6; animation: dashFlow 1.4s linear infinite; }
    .node-pulse { animation: pulse 2.4s ease-in-out infinite; }
    .cur { animation: blink 1s step-end infinite; }
  </style>

  <!-- window -->
  <rect x="20" y="16" width="860" height="814" rx="14" fill="#05070a" stroke="#182233"/>
  <path d="M20 30 A14 14 0 0 1 34 16 H846 A14 14 0 0 1 860 30 V58 H20 Z" fill="#0a0f1a"/>
  <line x1="20" y1="58" x2="860" y2="58" stroke="#182233"/>
  <circle cx="46" cy="37" r="6" fill="#3a4557"/>
  <circle cx="66" cy="37" r="6" fill="#3a4557"/>
  <circle cx="86" cy="37" r="6" fill="#3a4557"/>
  <text x="450" y="42" text-anchor="middle" class="dim" font-size="12.5">orchestrix://runtime — nanda@agentic-systems</text>

  <rect x="34" y="72" width="832" height="740" fill="url(#glow)" opacity="0.4"/>

  <!-- boot log -->
  <g class="fade" style="animation: fadeIn .2s ease .05s forwards">
    <text x="52" y="98"><tspan class="dim">[ </tspan><tspan class="ok">OK</tspan><tspan class="dim"> ] </tspan><tspan class="mut">runtime.init() — loading agent registry</tspan></text>
  </g>
  <g class="fade" style="animation: fadeIn .2s ease .18s forwards">
    <text x="52" y="120"><tspan class="dim">[ </tspan><tspan class="ok">OK</tspan><tspan class="dim"> ] </tspan><tspan class="mut">context.mount() — shared memory attached</tspan></text>
  </g>
  <g class="fade" style="animation: fadeIn .2s ease .31s forwards">
    <text x="52" y="142"><tspan class="dim">[ </tspan><tspan class="ok">OK</tspan><tspan class="dim"> ] </tspan><tspan class="mut">tools.register() — 4 tools bound to graph</tspan></text>
  </g>
  <g class="fade" style="animation: fadeIn .2s ease .44s forwards">
    <text x="52" y="164"><tspan class="dim">[ </tspan><tspan class="ok">OK</tspan><tspan class="dim"> ] </tspan><tspan class="mut">safety.gate() — human-in-the-loop checkpoint armed</tspan></text>
  </g>

  <g class="fade" style="animation: fadeIn .25s ease .58s forwards">
    <text x="450" y="200" text-anchor="middle" font-size="26"><tspan class="bright">nanda</tspan><tspan class="dim">@</tspan><tspan fill="url(#flow)">agentic-systems</tspan></text>
  </g>
  <g class="fade" style="animation: fadeIn .25s ease .66s forwards">
    <text x="450" y="222" text-anchor="middle" class="mut" font-size="13.5">AI Engineer — agentic systems · LLM infrastructure · production backends</text>
  </g>

  <line x1="52" y1="244" x2="848" y2="244" stroke="#182233"/>

  <!-- status query -->
  <g class="type" style="animation: typeIn .35s steps(28,start) .78s forwards">
    <text x="52" y="272" font-size="15"><tspan class="cy">nanda</tspan><tspan class="dim">:~ (main) $</tspan><tspan class="txt"> orchestrix status --agents</tspan></text>
  </g>

  <g class="fade" style="animation: fadeIn .2s ease 1.2s forwards">
    <text x="52" y="300" font-size="12.5"><tspan class="dim">  NAME</tspan><tspan class="dim" x="250">STACK</tspan><tspan class="dim" x="560">STATE</tspan></text>
  </g>
  <line x1="52" y1="310" x2="848" y2="310" stroke="#131b28"/>

  <g class="fade" style="animation: fadeIn .2s ease 1.32s forwards">
    <circle cx="58" cy="333" r="3.5" class="ok node-pulse"/>
    <text x="70" y="337"><tspan class="txt">lumora</tspan></text>
    <text x="250" y="337" class="mut" font-size="13">rag · fastapi · qdrant · postgres</text>
    <text x="560" y="337" class="cy" font-size="13">building — daily commits</text>
  </g>
  <g class="fade" style="animation: fadeIn .2s ease 1.42s forwards">
    <circle cx="58" cy="363" r="3.5" class="ok node-pulse"/>
    <text x="70" y="367"><tspan class="txt">orchestrix</tspan></text>
    <text x="250" y="367" class="mut" font-size="13">multi-agent · shared context · eval loop</text>
    <text x="560" y="367" class="cy" font-size="13">shipped — flagship</text>
  </g>
  <g class="fade" style="animation: fadeIn .2s ease 1.52s forwards">
    <circle cx="58" cy="393" r="3.5" class="ok node-pulse"/>
    <text x="70" y="397"><tspan class="txt">sentinel-sre</tspan></text>
    <text x="250" y="397" class="mut" font-size="13">langgraph · fastmcp · self-correction loop</text>
    <text x="560" y="397" class="cy" font-size="13">shipped — 9.3x efficiency</text>
  </g>

  <line x1="52" y1="424" x2="848" y2="424" stroke="#182233"/>

  <!-- cycle query -->
  <g class="type" style="animation: typeIn .35s steps(22,start) 1.68s forwards">
    <text x="52" y="452" font-size="15"><tspan class="cy">nanda</tspan><tspan class="dim">:~ (main) $</tspan><tspan class="txt"> orchestrix trace --cycle</tspan></text>
  </g>

  <!-- agentic loop diagram (signature element) -->
  <g class="fade" style="animation: fadeIn .4s ease 2.05s forwards">
    <g transform="translate(450,650)">
      <!-- connecting loop -->
      <path d="M -150 0 A 150 150 0 0 1 0 -150" fill="none" stroke="url(#flow)" stroke-width="2" class="flowline" opacity="0.85"/>
      <path d="M 0 -150 A 150 150 0 0 1 150 0" fill="none" stroke="url(#flow)" stroke-width="2" class="flowline" opacity="0.85"/>
      <path d="M 150 0 A 150 150 0 0 1 0 150" fill="none" stroke="url(#flow)" stroke-width="2" class="flowline" opacity="0.85"/>
      <path d="M 0 150 A 150 150 0 0 1 -150 0" fill="none" stroke="url(#flow)" stroke-width="2" class="flowline" opacity="0.85"/>

      <!-- nodes -->
      <g>
        <circle cx="0" cy="-150" r="34" fill="#0a0f1a" stroke="#22d3ee" stroke-width="1.5"/>
        <text x="0" y="-146" text-anchor="middle" class="txt" font-size="12.5">PLAN</text>
      </g>
      <g>
        <circle cx="150" cy="0" r="34" fill="#0a0f1a" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="150" y="4" text-anchor="middle" class="txt" font-size="12.5">ACT</text>
      </g>
      <g>
        <circle cx="0" cy="150" r="34" fill="#0a0f1a" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="0" y="154" text-anchor="middle" class="txt" font-size="11.5">OBSERVE</text>
      </g>
      <g>
        <circle cx="-150" cy="0" r="34" fill="#0a0f1a" stroke="#60a5fa" stroke-width="1.5"/>
        <text x="-150" y="4" text-anchor="middle" class="txt" font-size="11.5">CRITIQUE</text>
      </g>

      <text x="0" y="6" text-anchor="middle" class="dim" font-size="11">agentic</text>
      <text x="0" y="20" text-anchor="middle" class="dim" font-size="11">loop</text>
    </g>
  </g>

  <g class="fade" style="animation: fadeIn .3s ease 2.4s forwards">
    <text x="450" y="826" text-anchor="middle" class="dim" font-size="12.5">CSE (AI &amp; ML) · Maharaja Institute of Technology, Mysore · 2023–2027</text>
  </g>
</svg>
